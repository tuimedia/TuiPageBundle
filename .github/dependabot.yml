version: 2

updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment together
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: CI

  # This is a library, so widen constraints (e.g. add a new major) rather than raise the floors
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: widen
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        dependency-type: development
    open-pull-requests-limit: 5
